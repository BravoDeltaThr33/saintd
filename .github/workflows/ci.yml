name: Install and start on Linux, macOS and Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.route }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        include:
          - python: "3.10"
            route: private environment
          - python: "3.13"
            route: pipx
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.route }}" = pipx ]; then
            command -v pipx
            ./install.sh --no-pipx      # an earlier install without pipx, which pipx then takes over
            ./install.sh
            test ! -e "$HOME/.local/share/saintd-venv"
          else
            ./install.sh --no-pipx
            ./install.sh --no-pipx      # and an upgrade over it
          fi

      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if "${{ matrix.route }}"=="pipx" (
            where pipx || exit /b 1
            powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -NoPipx || exit /b 1
            powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 || exit /b 1
            if exist "%USERPROFILE%\.local\share\saintd-venv" exit /b 1
          ) else (
            powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -NoPipx || exit /b 1
            powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -NoPipx || exit /b 1
          )

      - name: Find the installed saintd
        run: |
          if [ "${{ matrix.route }}" = pipx ]; then
            venv="$(pipx environment --value PIPX_LOCAL_VENVS)/saint-directory"
            bin="$(pipx environment --value PIPX_BIN_DIR)"
          else
            venv="$HOME/.local/share/saintd-venv"
            bin="$HOME/.local/bin"
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            venv="$(cygpath -u "$venv")"; bin="$(cygpath -u "$bin")"
            py="$venv/Scripts/python.exe"; exe="$bin/saintd.exe"
          else
            py="$venv/bin/python"; exe="$bin/saintd"
          fi
          ls -l "$py" "$exe"
          echo "SAINTD_PY=$py" >> "$GITHUB_ENV"
          echo "SAINTD_EXE=$exe" >> "$GITHUB_ENV"

      - name: Run the command line
        run: |
          want="saintd $(sed -n 's/^__version__ = "\(.*\)"/\1/p' saintd/__init__.py)"
          got="$("$SAINTD_EXE" --version)"
          echo "$got"
          test "$got" = "$want"
          "$SAINTD_PY" -c "import sys; print(sys.version)"
          "$SAINTD_EXE" --terminal
          SAINTD_HOME="$RUNNER_TEMP/saintd-cli" "$SAINTD_EXE" --stats

      - name: eSpeak NG and aplay for the Linux check
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends espeak-ng alsa-utils

      - name: Voices, players, Piper and the interface
        run: |
          cat > "$RUNNER_TEMP/smoke.py" <<'EOF'
          """Start saintd on this computer without a terminal and check what differs between Linux, macOS and Windows."""
          import asyncio
          import json
          import os
          import sys
          import tempfile
          import time
          import wave
          from pathlib import Path

          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          home = Path(tempfile.mkdtemp(prefix="saintd-smoke-"))
          os.environ["SAINTD_HOME"] = str(home)

          from saintd import __version__, config, system, term, tts  # noqa: E402

          print(f"saintd {__version__} on {system.NAME}, Python {sys.version.split()[0]}")
          for f in (config.config_dir, config.data_dir, config.cache_dir):
              assert f().is_dir(), f
              assert str(f()).startswith(str(home)), f()

          # ------------------------------------------------------------------ voices and players
          print("engines:", {e: tts.ENGINES[e].available() for e in tts.ENGINE_ORDER})
          print("players:", tts.players())
          assert tts.players(), "no audio player"
          if system.MACOS:
              assert tts.ENGINE_ORDER == ["piper", "say", "espeak"]
              assert tts.players()[0] == "afplay"
          if system.WINDOWS:
              assert tts.ENGINE_ORDER == ["piper", "sapi", "espeak"]
              assert tts.players()[0] == "Windows audio"
          if system.LINUX:
              assert tts.ENGINE_ORDER == ["piper", "rhvoice", "pico", "espeak", "speechd", "festival"]

          own = {"darwin": "say", "win32": "sapi"}.get(sys.platform)
          if system.LINUX and tts.ENGINES["espeak"].available():
              own = "espeak"                                                       # the Linux check installs eSpeak NG
          if own:
              e = tts.ENGINES[own]
              assert e.available(), f"{own} is missing"
              voices = e.voices()
              print(f"{len(voices)} {own} voices:", [v.label for v in voices][:8])
              out = Path(tempfile.mkdtemp()) / "sample.wav"
              t = time.monotonic()
              e.synth(tts.speakable(tts.SAMPLE + " St. Seraphim of Sarov, 1754–1833 — “the Wonderworker”."), "", 1.2, out)
              print(f"made {tts.wav_seconds(out):.1f} s of speech in {time.monotonic() - t:.1f} s")
              assert tts.wav_seconds(out) > 1.0
              named = [v.id for v in voices if v.id]
              assert named, "no named English voice"
              e.synth("Holy Apostle Cleopas, pray to God for us.", named[0], 0.8, out.with_name("named.wav"))
              print(f"{named[0]}: {tts.wav_seconds(out.with_name('named.wav')):.1f} s")
              cfg = config.Config()
              eng, voice = tts.resolve(cfg)
              print("Automatic reads with:", eng.label if eng else None, repr(voice))
              assert eng is not None and eng.id in (own, "piper")

          # Piper: download a small voice and speak with it in Piper's own process
          piper = tts.ENGINES["piper"]
          print("Piper installed:", piper.available())
          if piper.available():
              # Piper's own process starts and answers (a voice that is not there is an answer, not a crash)
              ans = tts._piper_worker.request({"load": str(Path(tempfile.mkdtemp()) / "missing.onnx")})
              print("Piper's process answers:", ans)
              assert ans.get("ok") is False and ans.get("error"), ans
              t = time.monotonic()
              for attempt in range(3):
                  try:
                      tts.download_piper_voice("en_US-amy-low", catalog=tts.piper_catalog())
                      break
                  except tts.TTSError as err:                 # the voice server may ask us to wait
                      print("download:", err)
                      time.sleep(20 * (attempt + 1))
              else:
                  print("NOTE: the voice server refused the download; Piper's speech was not tried")
              if (tts.voices_dir() / "en_US-amy-low.onnx").exists():
                  piper.forget()
                  out = Path(tempfile.mkdtemp()) / "piper.wav"
                  piper.synth("Holy Apostle Cleopas, pray to God for us.", "en_US-amy-low", 1.0, out)
                  print(f"Piper made {tts.wav_seconds(out):.1f} s of speech ({time.monotonic() - t:.1f} s with the download)")
                  assert tts.wav_seconds(out) > 1.0
                  tts.delete_piper_voice("en_US-amy-low")
                  assert not (tts.voices_dir() / "en_US-amy-low.onnx").exists()
              tts._piper_worker.close()

          # pause, resume and stop, with a stand-in player that "plays" a file by waiting as long as it lasts
          wav = Path(tempfile.mkdtemp()) / "silence.wav"
          with wave.open(str(wav), "wb") as w:
              w.setnchannels(1), w.setsampwidth(2), w.setframerate(16000)
              w.writeframes(b"\0\0" * 16000 * 2)                                   # two seconds
          FAKE_PLAYER = """
          import sys, time, wave
          w = wave.open(sys.argv[1])
          left, last = w.getnframes() / w.getframerate(), time.monotonic()
          while left > 0:                       # like a real player, it plays nothing while it is frozen
              time.sleep(0.02)
              now = time.monotonic()
              left, last = left - min(now - last, 0.05), now
          """
          fake = [sys.executable, "-c", FAKE_PLAYER, "{f}"]
          t0 = time.monotonic()
          p = tts.Playback(tts._launch(fake, wav), fake, wav)
          time.sleep(0.8)
          p.pause()
          assert p.poll() is None, "a paused sound is not over"
          time.sleep(1.0)
          assert p.poll() is None
          p.resume()
          while p.poll() is None and time.monotonic() - t0 < 15:
              time.sleep(0.05)
          took = time.monotonic() - t0
          print(f"paused for 1.0 s: 2.0 s of sound took {took:.2f} s ({'freeze' if p.FREEZE else 'restart'} mode)")
          assert p.poll() == 0 and not p.failed
          assert 2.6 < took < 6.5, took
          p = tts.Playback(tts._launch(fake, wav), fake, wav)
          time.sleep(0.3)
          p.stop()
          assert p.poll() is not None and not p.failed, "stopping is not an error"

          # ------------------------------------------------------------------ the terminal report
          info = term.detect(probe_terminal=False)
          print(term.report(info))
          if system.WINDOWS:                    # a console window (cmd, PowerShell) and Windows Terminal
              con = term.from_environment({})
              assert con.family == "conhost" and con.truecolor and con.best_graphics() == "blocks", con
              assert term.from_environment({"WT_SESSION": "1"}).family == "windows terminal"

          # ------------------------------------------------------------------ the interface, without a terminal
          # no network from here on: every request fails at once, which the app must take calmly
          os.environ["HTTPS_PROXY"] = os.environ["HTTP_PROXY"] = "http://127.0.0.1:9"
          os.environ.pop("NO_PROXY", None)
          os.environ.pop("no_proxy", None)
          from saintd.core import Context  # noqa: E402
          from saintd.sync import BUILD_VERSION  # noqa: E402

          (Path(config.config_dir()) / "config.json").write_text(json.dumps(
              {"asked_contact": True, "auto_enrich": False, "tts_asked_voice": True}), encoding="utf-8")
          ctx = Context()
          ctx.db.set_meta("built_at", time.time())
          ctx.db.set_meta("build_version", BUILD_VERSION)
          ctx.close()

          from saintd.app import SaintDirectoryApp  # noqa: E402


          async def drive() -> None:
              app = SaintDirectoryApp(graphics_mode="blocks")
              async with app.run_test(size=(140, 42)) as pilot:
                  await pilot.pause(2.0)
                  for key in ("f2", "s", "e", "r", "a", "p", "h", "i", "m", "down", "f3", "f4", "question_mark", "escape",
                              "f1", "t", "n", "f4"):
                      await pilot.press(key)
                      await pilot.pause(0.25)
                  await pilot.pause(4.0)                       # Settings looks for the voices in the background
                  text = str(app.w_settings.query_one("#tts-engines").render())
                  print(text)
                  assert "Engines on this computer" in text
                  if own:
                      assert tts.ENGINES[own].label in text
                  await pilot.press("ctrl+q")


          asyncio.run(drive())
          print("the interface ran without an error")
          EOF
          "$SAINTD_PY" -I "$RUNNER_TEMP/smoke.py"
