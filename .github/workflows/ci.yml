name: Install and start on Linux, macOS and Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.route }}
    if: github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        include:
          - python: "3.10"
            route: private environment
          - python: "3.13"
            route: pipx
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.route }}" = pipx ]; then
            command -v pipx
            ./install.sh --no-pipx      # an earlier install without pipx, which pipx then takes over
            ./install.sh
            test ! -e "$HOME/.local/share/saintd-venv"
          else
            ./install.sh --no-pipx
            ./install.sh --no-pipx      # and an upgrade over it
          fi

      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if "${{ matrix.route }}"=="pipx" (
            where pipx || exit /b 1
            powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -NoPipx || exit /b 1
            powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 || exit /b 1
            if exist "%USERPROFILE%\.local\share\saintd-venv" exit /b 1
          ) else (
            powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -NoPipx || exit /b 1
            powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -NoPipx || exit /b 1
          )

      - name: Find the installed saintd
        run: |
          if [ "${{ matrix.route }}" = pipx ]; then
            venv="$(pipx environment --value PIPX_LOCAL_VENVS)/saint-directory"
            bin="$(pipx environment --value PIPX_BIN_DIR)"
          else
            venv="$HOME/.local/share/saintd-venv"
            bin="$HOME/.local/bin"
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            venv="$(cygpath -u "$venv")"; bin="$(cygpath -u "$bin")"
            py="$venv/Scripts/python.exe"; exe="$bin/saintd.exe"
          else
            py="$venv/bin/python"; exe="$bin/saintd"
          fi
          ls -l "$py" "$exe"
          echo "SAINTD_PY=$py" >> "$GITHUB_ENV"
          echo "SAINTD_EXE=$exe" >> "$GITHUB_ENV"

      - name: Run the command line
        run: |
          want="saintd $(sed -n 's/^__version__ = "\(.*\)"/\1/p' saintd/__init__.py)"
          got="$("$SAINTD_EXE" --version)"
          echo "$got"
          test "$got" = "$want"
          "$SAINTD_PY" -c "import sys; print(sys.version)"
          "$SAINTD_EXE" --terminal
          SAINTD_HOME="$RUNNER_TEMP/saintd-cli" "$SAINTD_EXE" --stats

      - name: eSpeak NG and aplay for the Linux check
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends espeak-ng alsa-utils xvfb

      - name: Voices, players, Piper and the interface
        run: |
          cat > "$RUNNER_TEMP/smoke.py" <<'EOF'
          """Start saintd on this computer without a terminal and check what differs between Linux, macOS and Windows."""
          import asyncio
          import json
          import os
          import sys
          import tempfile
          import time
          import wave
          from pathlib import Path

          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          home = Path(tempfile.mkdtemp(prefix="saintd-smoke-"))
          os.environ["SAINTD_HOME"] = str(home)

          from saintd import __version__, config, system, term, tts  # noqa: E402

          print(f"saintd {__version__} on {system.NAME}, Python {sys.version.split()[0]}")
          for f in (config.config_dir, config.data_dir, config.cache_dir):
              assert f().is_dir(), f
              assert str(f()).startswith(str(home)), f()

          # ------------------------------------------------------------------ voices and players
          print("engines:", {e: tts.ENGINES[e].available() for e in tts.ENGINE_ORDER})
          print("players:", tts.players())
          assert tts.players(), "no audio player"
          if system.MACOS:
              assert tts.ENGINE_ORDER == ["piper", "say", "espeak"]
              assert tts.players()[0] == "afplay"
          if system.WINDOWS:
              assert tts.ENGINE_ORDER == ["piper", "sapi", "espeak"]
              assert tts.players()[0] == "Windows audio"
          if system.LINUX:
              assert tts.ENGINE_ORDER == ["piper", "rhvoice", "pico", "espeak", "speechd", "festival"]

          own = {"darwin": "say", "win32": "sapi"}.get(sys.platform)
          if system.LINUX and tts.ENGINES["espeak"].available():
              own = "espeak"                                                       # the Linux check installs eSpeak NG
          if own:
              e = tts.ENGINES[own]
              assert e.available(), f"{own} is missing"
              voices = e.voices()
              print(f"{len(voices)} {own} voices:", [v.label for v in voices][:8])
              out = Path(tempfile.mkdtemp()) / "sample.wav"
              t = time.monotonic()
              e.synth(tts.speakable(tts.SAMPLE + " St. Seraphim of Sarov, 1754–1833 — “the Wonderworker”."), "", 1.2, out)
              print(f"made {tts.wav_seconds(out):.1f} s of speech in {time.monotonic() - t:.1f} s")
              assert tts.wav_seconds(out) > 1.0
              named = [v.id for v in voices if v.id]
              assert named, "no named English voice"
              e.synth("Holy Apostle Cleopas, pray to God for us.", named[0], 0.8, out.with_name("named.wav"))
              print(f"{named[0]}: {tts.wav_seconds(out.with_name('named.wav')):.1f} s")
              cfg = config.Config()
              eng, voice = tts.resolve(cfg)
              print("Automatic reads with:", eng.label if eng else None, repr(voice))
              assert eng is not None and eng.id in (own, "piper")

          # Piper: download a small voice and speak with it in Piper's own process
          piper = tts.ENGINES["piper"]
          print("Piper installed:", piper.available())
          if piper.available():
              # Piper's own process starts and answers (a voice that is not there is an answer, not a crash)
              ans = tts._piper_worker.request({"load": str(Path(tempfile.mkdtemp()) / "missing.onnx")})
              print("Piper's process answers:", ans)
              assert ans.get("ok") is False and ans.get("error"), ans
              t = time.monotonic()
              for attempt in range(3):
                  try:
                      tts.download_piper_voice("en_US-amy-low", catalog=tts.piper_catalog())
                      break
                  except tts.TTSError as err:                 # the voice server may ask us to wait
                      print("download:", err)
                      time.sleep(20 * (attempt + 1))
              else:
                  print("NOTE: the voice server refused the download; Piper's speech was not tried")
              if (tts.voices_dir() / "en_US-amy-low.onnx").exists():
                  piper.forget()
                  out = Path(tempfile.mkdtemp()) / "piper.wav"
                  piper.synth("Holy Apostle Cleopas, pray to God for us.", "en_US-amy-low", 1.0, out)
                  print(f"Piper made {tts.wav_seconds(out):.1f} s of speech ({time.monotonic() - t:.1f} s with the download)")
                  assert tts.wav_seconds(out) > 1.0
                  tts.delete_piper_voice("en_US-amy-low")
                  assert not (tts.voices_dir() / "en_US-amy-low.onnx").exists()
              tts._piper_worker.close()

          # pause, resume and stop, with a stand-in player that "plays" a file by waiting as long as it lasts
          wav = Path(tempfile.mkdtemp()) / "silence.wav"
          with wave.open(str(wav), "wb") as w:
              w.setnchannels(1), w.setsampwidth(2), w.setframerate(16000)
              w.writeframes(b"\0\0" * 16000 * 2)                                   # two seconds
          FAKE_PLAYER = """
          import sys, time, wave
          w = wave.open(sys.argv[1])
          left, last = w.getnframes() / w.getframerate(), time.monotonic()
          while left > 0:                       # like a real player, it plays nothing while it is frozen
              time.sleep(0.02)
              now = time.monotonic()
              left, last = left - min(now - last, 0.05), now
          """
          fake = [sys.executable, "-c", FAKE_PLAYER, "{f}"]
          t0 = time.monotonic()
          p = tts.Playback(tts._launch(fake, wav), fake, wav)
          time.sleep(0.8)
          p.pause()
          assert p.poll() is None, "a paused sound is not over"
          time.sleep(1.0)
          assert p.poll() is None
          p.resume()
          while p.poll() is None and time.monotonic() - t0 < 15:
              time.sleep(0.05)
          took = time.monotonic() - t0
          print(f"paused for 1.0 s: 2.0 s of sound took {took:.2f} s ({'freeze' if p.FREEZE else 'restart'} mode)")
          assert p.poll() == 0 and not p.failed
          assert 2.6 < took < 6.5, took
          p = tts.Playback(tts._launch(fake, wav), fake, wav)
          time.sleep(0.3)
          p.stop()
          assert p.poll() is not None and not p.failed, "stopping is not an error"

          # ------------------------------------------------------------------ the terminal report
          info = term.detect(probe_terminal=False)
          print(term.report(info))
          if system.WINDOWS:                    # a console window (cmd, PowerShell) and Windows Terminal
              con = term.from_environment({})
              assert con.family == "conhost" and con.truecolor and con.best_graphics() == "blocks", con
              assert term.from_environment({"WT_SESSION": "1"}).family == "windows terminal"

          # ------------------------------------------------------------------ the interface, without a terminal
          # no network from here on: every request fails at once, which the app must take calmly
          os.environ["HTTPS_PROXY"] = os.environ["HTTP_PROXY"] = "http://127.0.0.1:9"
          os.environ.pop("NO_PROXY", None)
          os.environ.pop("no_proxy", None)
          from saintd.core import Context  # noqa: E402
          from saintd.sync import BUILD_VERSION  # noqa: E402

          (Path(config.config_dir()) / "config.json").write_text(json.dumps(
              {"asked_contact": True, "auto_enrich": False, "tts_asked_voice": True}), encoding="utf-8")
          ctx = Context()
          ctx.db.set_meta("built_at", time.time())
          ctx.db.set_meta("build_version", BUILD_VERSION)
          ctx.close()

          from saintd.app import SaintDirectoryApp  # noqa: E402


          async def drive() -> None:
              app = SaintDirectoryApp(graphics_mode="blocks")
              async with app.run_test(size=(140, 42)) as pilot:
                  await pilot.pause(2.0)
                  for key in ("f2", "s", "e", "r", "a", "p", "h", "i", "m", "down", "f3", "f4", "question_mark", "escape",
                              "f1", "t", "n", "f4"):
                      await pilot.press(key)
                      await pilot.pause(0.25)
                  await pilot.pause(4.0)                       # Settings looks for the voices in the background
                  text = str(app.w_settings.query_one("#tts-engines").render())
                  print(text)
                  assert "Engines on this computer" in text
                  if own:
                      assert tts.ENGINES[own].label in text
                  await pilot.press("ctrl+q")


          asyncio.run(drive())
          print("the interface ran without an error")
          EOF
          "$SAINTD_PY" -I "$RUNNER_TEMP/smoke.py"

      - name: saintd's own window (saintd --window)
        run: |
          export SAINTD_HOME="$RUNNER_TEMP/saintd-window"
          "$SAINTD_PY" -I - <<'EOF'
          import json, time
          from pathlib import Path
          from saintd import config
          from saintd.core import Context
          from saintd.sync import BUILD_VERSION
          (Path(config.config_dir()) / "config.json").write_text(json.dumps(
              {"asked_contact": True, "auto_enrich": False, "tts_asked_voice": True}), encoding="utf-8")
          ctx = Context()
          ctx.db.set_meta("built_at", time.time())
          ctx.db.set_meta("build_version", BUILD_VERSION)
          ctx.close()
          EOF
          export HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9
          export SAINTD_SNAPSHOT="$RUNNER_TEMP/saintd-window.png" SAINTD_WINDOW_SIZE=120x36
          display=()
          if [ "$RUNNER_OS" = Linux ]; then display=(xvfb-run -a -s "-screen 0 1600x1000x24"); fi
          "${display[@]}" "$SAINTD_PY" -I -c \
            "import subprocess, sys; sys.exit(subprocess.run(sys.argv[1:], timeout=180).returncode)" "$SAINTD_EXE" --window
          "$SAINTD_PY" -I - <<'EOF'
          import os
          from PIL import Image
          from saintd.config import data_dir
          err = data_dir() / "window-error.log"
          assert not err.exists(), err.read_text(encoding="utf-8")
          im = Image.open(os.environ["SAINTD_SNAPSHOT"]).convert("RGB")
          colours = len(im.getcolors(1 << 20) or [])
          print(f"the window's picture: {im.width}x{im.height}, {colours} colours")
          assert im.width > 900 and im.height > 500 and colours > 200, "the window looks empty"
          EOF

  exe:
    name: saintd.exe, the Windows program
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build saintd.exe
        run: |
          python -m pip install --disable-pip-version-check -q . "pyinstaller>=6.10,<7"
          work="$(cygpath -u "$RUNNER_TEMP")/exe"
          mkdir -p "$work/fonts" "$work/licenses"
          cd "$work"
          # the DejaVu fonts (free to share, with their licence), so the window looks as saintd does on Linux
          curl -sSfL -o dejavu.tar.bz2 \
            https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.tar.bz2
          echo "fa9ca4d13871dd122f61258a80d01751d603b4d3ee14095d65453b4e846e17d7  dejavu.tar.bz2" | sha256sum -c -
          python -I - <<'EOF'
          import shutil
          import sys
          import tarfile
          from pathlib import Path
          from PIL import Image
          import saintd

          want = ["DejaVuSansMono", "DejaVuSansMono-Bold", "DejaVuSansMono-Oblique", "DejaVuSansMono-BoldOblique",
                  "DejaVuSans", "DejaVuSans-Bold", "DejaVuSerif-Bold"]
          with tarfile.open("dejavu.tar.bz2") as t:
              for name in want:
                  data = t.extractfile(f"dejavu-fonts-ttf-2.37/ttf/{name}.ttf").read()
                  Path(f"fonts/{name}.ttf").write_bytes(data)
              Path("fonts/DejaVu-LICENSE.txt").write_bytes(t.extractfile("dejavu-fonts-ttf-2.37/LICENSE").read())
          # Python's own licence goes with it (the packages' licences come with their metadata)
          shutil.copy(Path(sys.base_prefix) / "LICENSE.txt", "licenses/Python-LICENSE.txt")

          # the program's icon: the eagle of the tab column
          eagle = Image.open(Path(saintd.__file__).parent / "assets" / "eagle.png").convert("RGBA")
          side = max(eagle.size)
          square = Image.new("RGBA", (side, side), (0, 0, 0, 0))
          square.paste(eagle, ((side - eagle.width) // 2, (side - eagle.height) // 2))
          square.save("saintd.ico", sizes=[(s, s) for s in (16, 20, 24, 32, 40, 48, 64, 128, 256)])

          # the version shown in the program's Properties
          v = tuple(int(x) for x in saintd.__version__.split(".")[:3]) + (0,)
          Path("version.txt").write_text(f"""VSVersionInfo(
            ffi=FixedFileInfo(filevers={v}, prodvers={v}),
            kids=[StringFileInfo([StringTable('040904B0', [
              StringStruct('FileDescription', 'Saint Directory'),
              StringStruct('ProductName', 'Saint Directory'),
              StringStruct('FileVersion', '{saintd.__version__}'),
              StringStruct('ProductVersion', '{saintd.__version__}'),
              StringStruct('OriginalFilename', 'saintd.exe'),
              StringStruct('LegalCopyright', 'Copyright (c) 2026 BravoDeltaThr33, MIT License')])]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])])
          """, encoding="utf-8")
          EOF
          printf 'from saintd.window import exe_main\nraise SystemExit(exe_main())\n' > saintd-exe.py
          python -m PyInstaller --noconfirm --clean --log-level WARN --onefile --windowed --name saintd \
            --icon saintd.ico --version-file version.txt --add-data "fonts;fonts" --add-data "licenses;licenses" \
            --collect-data saintd --collect-submodules saintd --collect-submodules textual --collect-data textual \
            --recursive-copy-metadata saint-directory --hidden-import PIL._tkinter_finder --hidden-import winsound \
            saintd-exe.py
          ls -l dist/saintd.exe
          (cd dist && sha256sum saintd.exe > saintd.exe.sha256 && cat saintd.exe.sha256)

      - name: Start saintd.exe and take its picture
        run: |
          cd "$(cygpath -u "$RUNNER_TEMP")/exe"
          export SAINTD_HOME="$(cygpath -w "$RUNNER_TEMP/exe-home")"
          python -I - <<'EOF'
          import json, time
          from pathlib import Path
          from saintd import config
          from saintd.core import Context
          from saintd.sync import BUILD_VERSION
          (Path(config.config_dir()) / "config.json").write_text(json.dumps(
              {"asked_contact": True, "auto_enrich": False, "tts_asked_voice": True}), encoding="utf-8")
          ctx = Context()
          ctx.db.set_meta("built_at", time.time())
          ctx.db.set_meta("build_version", BUILD_VERSION)
          ctx.close()
          EOF
          # no network: every request fails at once, which the program must take calmly
          export HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9
          export SAINTD_SNAPSHOT="$(cygpath -w "$PWD/dist/saintd-exe.png")" SAINTD_WINDOW_SIZE=140x42
          start=$(date +%s)
          timeout 180 ./dist/saintd.exe && code=0 || code=$?
          echo "saintd.exe ended with $code after $(( $(date +%s) - start )) s"
          err="$(cygpath -u "$SAINTD_HOME")/data/window-error.log"
          if [ -f "$err" ]; then cat "$err"; fi
          test "$code" = 0 && test ! -f "$err"
          python -I - <<'EOF'
          import os
          from PIL import Image
          im = Image.open(os.environ["SAINTD_SNAPSHOT"]).convert("RGB")
          colours = len(im.getcolors(1 << 20) or [])
          print(f"the window's picture: {im.width}x{im.height}, {colours} colours")
          assert im.width > 1000 and im.height > 600 and colours > 200, "the window looks empty"
          EOF
          # saintd plays speech with its own Python, which in the program is saintd.exe itself:
          # that start must play the file and end, not open a second window
          python -I -c "import wave; w = wave.open('silence.wav', 'wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000); w.writeframes(b'\0\0' * 8000); w.close()"
          timeout 60 ./dist/saintd.exe -I -c "import sys, winsound; winsound.PlaySound(sys.argv[1], winsound.SND_FILENAME | winsound.SND_NODEFAULT)" silence.wav && code=0 || code=$?
          echo "the sound player ended with $code (0 played; 1 this computer has no sound device)"
          test "$code" = 0 || test "$code" = 1

      - uses: actions/upload-artifact@v4
        with:
          name: saintd-exe
          path: |
            ${{ runner.temp }}/exe/dist/saintd.exe
            ${{ runner.temp }}/exe/dist/saintd.exe.sha256
            ${{ runner.temp }}/exe/dist/saintd-exe.png
          if-no-files-found: error

  exe-release:
    name: Attach saintd.exe to the release
    if: github.event_name == 'release'
    needs: exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: saintd-exe
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" saintd.exe saintd.exe.sha256 --clobber --repo "${{ github.repository }}"
